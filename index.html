---
layout: default
description: 전국 전기차 충전소 위치와 실시간 충전기 상태(급속/완속)를 한눈에 확인하세요. 내 위치 근처 충전소도 바로 찾을 수 있습니다.
---

<div class="home-page">

  <div class="home-hero">
    <h1>🔌 전국 전기차 충전소 찾기</h1>
    <p>급속/완속 구분, 실시간 충전기 현황, 무료주차 여부까지 한눈에</p>
  </div>

  <div class="search-wrap">
    <div class="search-box-wrap">
      <input type="text" id="searchBox" class="search-box" placeholder="충전소명, 지역 검색...">
      <button id="nearMeBtn" class="near-me-btn">📍 내 위치 근처</button>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>

  <div id="nearMeResults" class="near-me-results" style="display:none;"></div>

  <!-- 광고 -->
  <div class="ad-wrap">
    <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-6464921081676309" data-ad-slot="7080296704" data-ad-format="auto" data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>

  <div class="home-section">
    <h2>🗺️ 지역별로 찾기</h2>
    <div class="region-btn-grid">
      {% for region in site.data.regions %}
      <a href="/region/{{ region.slug }}/" class="region-btn">{{ region.sido }}</a>
      {% endfor %}
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@7/dist/fuse.min.js"></script>
<script src="{{ '/assets/js/main.js' | relative_url }}"></script>
